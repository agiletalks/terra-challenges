let draggedCard = null;
let dragOriginList = null;

function renderBoard() {
  const board = document.getElementById("board");
  themes.forEach((theme) => {
    const section = document.createElement("div");
    section.className = "theme-section";

    const title = document.createElement("div");
    title.className = "theme-title";
    title.textContent = theme.title;
    section.appendChild(title);

    const list = document.createElement("div");
    list.className = "cards-list";
    list.addEventListener("dragover", handleDragOver);
    list.addEventListener("drop", handleDrop);

    theme.cards.forEach((cardData) => {
      list.appendChild(createCard(cardData));
    });

    section.appendChild(list);
    board.appendChild(section);
  });
}

function createCard(cardData) {
  const card = document.createElement("div");
  card.className = "hmw-card";
  card.draggable = true;
  card.dataset.angle = cardData.angle;

  const content = document.createElement("div");
  content.className = "card-content";

  const badge = document.createElement("span");
  badge.className = `angle-badge badge-${cardData.angle}`;
  badge.textContent = angleLabels[cardData.angle];
  content.appendChild(badge);

  content.appendChild(createTextRow("中", cardData.zh));
  content.appendChild(createTextRow("EN", cardData.en));
  content.appendChild(createTextRow("JA", cardData.ja));

  const source = document.createElement("div");
  source.className = "original-source";
  source.textContent = cardData.source;
  content.appendChild(source);

  const voteArea = document.createElement("div");
  voteArea.className = "vote-area";
  voteArea.innerHTML = `
    <button class="vote-change-btn" onclick="adjustVote(this, -1)">-</button>
    <div class="vote-display-wrapper">
      <span class="vote-heart-icon">❤️</span>
      <span class="vote-count">0</span>
    </div>
    <button class="vote-change-btn" onclick="adjustVote(this, 1)">+</button>
  `;

  card.appendChild(content);
  card.appendChild(voteArea);

  card.addEventListener("dragstart", () => {
    draggedCard = card;
    dragOriginList = card.parentElement;
    card.classList.add("dragging");
  });

  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
    draggedCard = null;
    dragOriginList = null;
  });

  return card;
}

function createTextRow(label, text) {
  const row = document.createElement("div");
  row.className = "hmw-text";

  const strong = document.createElement("strong");
  strong.textContent = label;

  row.appendChild(strong);
  row.append(`：${text}`);
  return row;
}

function handleDragOver(event) {
  event.preventDefault();
  const list = event.currentTarget;
  if (!draggedCard || list !== dragOriginList) return;

  const afterElement = getDragAfterElement(list, event.clientY);
  if (afterElement == null) {
    list.appendChild(draggedCard);
  } else {
    list.insertBefore(draggedCard, afterElement);
  }
}

function handleDrop(event) {
  event.preventDefault();
}

function getDragAfterElement(container, y) {
  const draggableElements = [...container.querySelectorAll(".hmw-card:not(.dragging)")];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset, element: child };
    }
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function adjustVote(button, delta) {
  const countEl = button.parentElement.querySelector(".vote-count");
  const nextValue = Math.max(0, Number(countEl.textContent) + delta);
  countEl.textContent = nextValue;
}

function exportResults() {
  const sections = [...document.querySelectorAll(".theme-section")];
  const lines = ["HMW 創意思考討論結果", `匯出時間：${new Date().toLocaleString()}`, ""];

  sections.forEach((section, sectionIndex) => {
    lines.push(`${sectionIndex + 1}. ${section.querySelector(".theme-title").textContent}`);
    const cards = [...section.querySelectorAll(".hmw-card")];
    cards.forEach((card, cardIndex) => {
      const votes = card.querySelector(".vote-count").textContent;
      const badge = card.querySelector(".angle-badge").textContent;
      const rows = [...card.querySelectorAll(".hmw-text")].map((row) => row.innerText.trim());
      const source = card.querySelector(".original-source").textContent.trim();
      lines.push(`  ${cardIndex + 1}. [${votes}票] ${badge}`);
      rows.forEach((row) => lines.push(`     ${row}`));
      lines.push(`     ${source}`);
    });
    lines.push("");
  });

  copyText(lines.join("\n"));
}

function copyText(text) {
  const status = document.getElementById("exportStatus");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      status.textContent = "已複製到剪貼簿";
      window.setTimeout(() => status.textContent = "", 2400);
    }).catch(() => fallbackCopy(text, status));
  } else {
    fallbackCopy(text, status);
  }
}

function fallbackCopy(text, status) {
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.setAttribute("readonly", "");
  textarea.style.position = "fixed";
  textarea.style.left = "-9999px";
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand("copy");
  document.body.removeChild(textarea);
  status.textContent = "已複製到剪貼簿";
  window.setTimeout(() => status.textContent = "", 2400);
}

renderBoard();
